[project]
name = "marketlens"
version = "0.1.0"
description = "MarketLens backend"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.20,<2",
  "fastapi>=0.141,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
