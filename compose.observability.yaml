services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketlens_observability}
      POSTGRES_USER: ${POSTGRES_USER:-marketlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.observability.example to .env.observability first}
    volumes:
      - observability_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketlens} -d ${POSTGRES_DB:-marketlens_observability}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-marketlens}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-marketlens_observability}
      PORT: 8000
      CORS_ALLOWED_ORIGINS: http://localhost:8001
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_ENVIRONMENT: local-demo
      OTEL_METRIC_EXPORT_INTERVAL_MILLIS: 5000
    ports:
      - "127.0.0.1:${MARKETLENS_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
      otel-collector:
        condition: service_started

  alert-receiver:
    build: .
    command: ["python", "-m", "app.alert_receiver"]
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${ONCALL_FEED_PORT:-8081}:8080"
    networks:
      - default

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=24h"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo
      - loki
      - alert-receiver

volumes:
  observability_postgres_data:
  prometheus_data:
  tempo_data:
  loki_data:
  grafana_data:
